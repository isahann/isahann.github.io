<div class="window">
  <app-window-title-bar [title]="this.windowTitleBar" iconPath="about-me.png"></app-window-title-bar>
  <div class="window-body">
    <section class="tabs">
      <menu role="tablist" aria-label="Sample tabs">
        @for (tab of windowTabs; track tab) {
          <button
            role="tab"
            [attr.aria-controls]="tab.id"
            [attr.aria-selected]="tab.selected"
            (click)="this.changeSelectedTab(tab)"
            >
            {{tab.title}}
          </button>
        }
      </menu>

      @for (tab of windowTabs; track tab) {
        <article
          role="tabpanel"
          [id]="tab.id"
          [hidden]="!tab.selected"
          >
          <ng-template [ngComponentOutlet]="tab.component"></ng-template>
        </article>
      }
    </section>

    <div class="home">
      <app-icon-button iconPath="home.png" title="Home" routerLink=""></app-icon-button>
    </div>
  </div>
</div>
